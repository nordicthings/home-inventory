<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventar - Nordic Things</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="alternate icon" th:href="@{/favicon.ico}">
    <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
    <script defer th:src="@{/js/inventory-list-sticky.js}"></script>
</head>
<body>
<header class="topbar">
    <div class="topbar__inner">
        <a class="brand" th:href="@{/items}">Nordic Things</a>
        <nav class="nav" aria-label="Hauptnavigation">
            <a class="nav__link nav__link--active" th:href="@{/items}">Inventar</a>
            <a class="nav__link" th:href="@{/categories}">Kategorien</a>
            <a class="nav__link" th:href="@{/locations}">Orte</a>
            <a class="nav__link" th:href="@{/sources}">Bezugsquellen</a>
        </nav>
    </div>
</header>

<main class="page page--inventory">
    <div class="page__header">
        <h1>Inventar</h1>
        <div class="page__actions">
            <a class="button button--secondary"
               th:href="@{/items/report(name=${page.filter.name},categoryId=${page.filter.categoryId},locationId=${page.filter.locationId},sourceId=${page.filter.sourceId},status=${page.filter.status},sort=${page.sort.field},direction=${page.sort.direction})}">
                <svg class="icon" aria-hidden="true"><use href="/icons/lucide.svg#file-text"></use></svg>
                Report anzeigen
            </a>
            <a class="button button--primary" href="/items/new">Gegenstand hinzufügen</a>
        </div>
    </div>

    <section class="toolbar" aria-label="Inventar filtern">
        <div th:replace="~{items/_filters :: itemFilters}"></div>
    </section>

    <section class="table-section" aria-label="Gegenstände">
        <div id="item-table" th:replace="~{items/_table :: itemTable}"></div>
    </section>
</main>
</body>
</html>
