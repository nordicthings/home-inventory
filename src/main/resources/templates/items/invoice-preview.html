<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${page.filename + ' - Nordic Things'}">Rechnung - Nordic Things</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="alternate icon" th:href="@{/favicon.ico}">
    <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
    <script defer th:src="@{/js/escape-navigation.js}"></script>
</head>
<body>
<header class="topbar">
    <div class="topbar__inner">
        <a class="brand" th:href="@{/items}">Nordic Things</a>
        <nav class="nav" aria-label="Hauptnavigation">
            <a class="nav__link nav__link--active" th:href="@{/items}">Inventar</a>
            <a class="nav__link" th:href="@{/categories}">Kategorien</a>
            <a class="nav__link" th:href="@{/locations}">Orte</a>
            <a class="nav__link" th:href="@{/sources}">Bezugsquellen</a>
        </nav>
    </div>
</header>

<main class="page page--pdf-preview" th:attr="data-escape-href=@{/items}">
    <div class="page__header">
        <div>
            <p class="eyebrow" th:text="${page.itemName}">Laptop</p>
            <h1 th:text="${page.filename}">rechnung.pdf</h1>
        </div>
        <div class="page__actions">
            <a class="button button--primary"
               th:href="@{/items/{id}/acquisitions/{acquisitionId}/invoice/download(id=${page.itemId},acquisitionId=${page.acquisitionId})}">
                <svg class="icon" aria-hidden="true"><use href="/icons/lucide.svg#download"></use></svg>
                Herunterladen
            </a>
            <a class="button button--secondary" th:href="@{/items/{id}(id=${page.itemId})}">
                <svg class="icon" aria-hidden="true"><use href="/icons/lucide.svg#arrow-left"></use></svg>
                Zurück zum Gegenstand
            </a>
        </div>
    </div>

    <section class="pdf-preview" aria-label="Rechnungsvorschau">
        <object class="pdf-preview__viewer"
                type="application/pdf"
                th:attr="data=@{/items/{id}/acquisitions/{acquisitionId}/invoice/preview/content(id=${page.itemId},acquisitionId=${page.acquisitionId})}">
            <p>
                Die PDF-Vorschau kann in diesem Browser nicht angezeigt werden.
                <a th:href="@{/items/{id}/acquisitions/{acquisitionId}/invoice/download(id=${page.itemId},acquisitionId=${page.acquisitionId})}">
                    Rechnung herunterladen
                </a>
            </p>
        </object>
    </section>
</main>
</body>
</html>
