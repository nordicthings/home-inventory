<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="table-wrap" th:fragment="itemTable">
    <table class="data-table">
        <thead>
        <tr>
            <th scope="col">
                <a class="sort-link"
                   th:classappend="${page.sort.field == 'name'} ? ' sort-link--active'"
                   th:href="@{/items(name=${page.filter.name},categoryId=${page.filter.categoryId},locationId=${page.filter.locationId},sourceId=${page.filter.sourceId},sort='name',direction=${page.sort.nextDirectionFor('name')})}">
                    Name
                    <span class="sort-link__indicator" th:text="${page.sort.indicatorFor('name')}"></span>
                </a>
            </th>
            <th scope="col">
                <a class="sort-link"
                   th:classappend="${page.sort.field == 'category'} ? ' sort-link--active'"
                   th:href="@{/items(name=${page.filter.name},categoryId=${page.filter.categoryId},locationId=${page.filter.locationId},sourceId=${page.filter.sourceId},sort='category',direction=${page.sort.nextDirectionFor('category')})}">
                    Kategorie
                    <span class="sort-link__indicator" th:text="${page.sort.indicatorFor('category')}"></span>
                </a>
            </th>
            <th class="number" scope="col">
                <a class="sort-link sort-link--number"
                   th:classappend="${page.sort.field == 'quantity'} ? ' sort-link--active'"
                   th:href="@{/items(name=${page.filter.name},categoryId=${page.filter.categoryId},locationId=${page.filter.locationId},sourceId=${page.filter.sourceId},sort='quantity',direction=${page.sort.nextDirectionFor('quantity')})}">
                    Menge
                    <span class="sort-link__indicator" th:text="${page.sort.indicatorFor('quantity')}"></span>
                </a>
            </th>
            <th class="number" scope="col">
                <a class="sort-link sort-link--number"
                   th:classappend="${page.sort.field == 'averageValue'} ? ' sort-link--active'"
                   th:href="@{/items(name=${page.filter.name},categoryId=${page.filter.categoryId},locationId=${page.filter.locationId},sourceId=${page.filter.sourceId},sort='averageValue',direction=${page.sort.nextDirectionFor('averageValue')})}">
                    Wert
                    <span class="sort-link__indicator" th:text="${page.sort.indicatorFor('averageValue')}"></span>
                </a>
            </th>
            <th class="number" scope="col">
                <a class="sort-link sort-link--number"
                   th:classappend="${page.sort.field == 'totalValue'} ? ' sort-link--active'"
                   th:href="@{/items(name=${page.filter.name},categoryId=${page.filter.categoryId},locationId=${page.filter.locationId},sourceId=${page.filter.sourceId},sort='totalValue',direction=${page.sort.nextDirectionFor('totalValue')})}">
                    Gesamt
                    <span class="sort-link__indicator" th:text="${page.sort.indicatorFor('totalValue')}"></span>
                </a>
            </th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td>
                <a class="table-link" th:href="@{/items/{id}(id=${item.id})}" th:text="${item.name}">Laptop</a>
            </td>
            <td th:text="${item.categoryName}">Computer &amp; Peripherie</td>
            <td class="number" th:text="${item.totalQuantity}">2</td>
            <td class="number" th:text="${item.averageValue}">800.00 EUR</td>
            <td class="number" th:text="${item.totalValue}">1600.00 EUR</td>
        </tr>
        <tr th:if="${#lists.isEmpty(items)}">
            <td class="empty" colspan="5">Keine Gegenstände gefunden</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
