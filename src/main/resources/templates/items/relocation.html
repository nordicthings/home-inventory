<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Umlagerung erfassen - Nordic Things</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
    <div class="topbar__inner">
        <a class="brand" th:href="@{/items}">Nordic Things</a>
        <nav class="nav" aria-label="Hauptnavigation">
            <a class="nav__link nav__link--active" th:href="@{/items}">Inventar</a>
            <a class="nav__link" th:href="@{/categories}">Kategorien</a>
            <a class="nav__link" th:href="@{/locations}">Orte</a>
            <a class="nav__link" th:href="@{/sources}">Bezugsquellen</a>
        </nav>
    </div>
</header>

<main class="page page--narrow">
    <div class="page__header">
        <div>
            <p class="eyebrow" th:text="${page.itemName}">Laptop</p>
            <h1>Umlagerung erfassen</h1>
        </div>
        <a class="button button--secondary" th:href="@{/items/{id}(id=${page.itemId})}">Zurück zum Gegenstand</a>
    </div>

    <form class="form" method="post" th:action="@{/items/{id}/relocations(id=${page.itemId})}">
        <div class="form__errors" th:if="${!#lists.isEmpty(page.globalErrors)}">
            <p th:each="error : ${page.globalErrors}" th:text="${error.message}">Die Eingaben sind ungültig.</p>
        </div>

        <input type="hidden" name="sourceLocationId" th:value="${page.form.sourceLocationId}">

        <dl class="form-summary">
            <div>
                <dt>Quellort</dt>
                <dd th:text="${page.sourceLocationName}">Küche</dd>
            </div>
            <div>
                <dt>Aktueller Bestand</dt>
                <dd th:text="${page.sourceQuantity}">5</dd>
            </div>
        </dl>

        <div class="field">
            <label for="targetLocationId">Zielort</label>
            <select id="targetLocationId"
                    name="targetLocationId"
                    autofocus
                    th:classappend="${page.errorFor('targetLocationId') != null} ? 'input--error'">
                <option value="" th:selected="${page.form.targetLocationId == ''}">Zielort auswählen</option>
                <option th:each="location : ${page.locations}"
                        th:value="${location.id}"
                        th:text="${location.label}"
                        th:selected="${location.id == page.form.targetLocationId}"></option>
            </select>
            <p class="field-error" th:if="${page.errorFor('targetLocationId') != null}" th:text="${page.errorFor('targetLocationId')}">Zielort ist erforderlich.</p>
        </div>

        <div class="field">
            <label for="quantity">Menge</label>
            <input id="quantity"
                   name="quantity"
                   type="text"
                   inputmode="numeric"
                   autocomplete="off"
                   pattern="([0-9]+|[0-9]{1,3}(\.[0-9]{3})+)"
                   th:value="${page.form.quantity}"
                   th:classappend="${page.errorFor('quantity') != null} ? 'input--error'">
            <p class="field-error" th:if="${page.errorFor('quantity') != null}" th:text="${page.errorFor('quantity')}">Menge ist erforderlich.</p>
        </div>

        <div class="form__actions">
            <button class="button button--primary" type="submit">Umlagerung speichern</button>
            <a class="button button--secondary" th:href="@{/items/{id}(id=${page.itemId})}">Abbrechen</a>
        </div>
    </form>
</main>
</body>
</html>
