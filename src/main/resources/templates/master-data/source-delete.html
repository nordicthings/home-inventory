<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bezugsquelle löschen - Nordic Things</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="alternate icon" th:href="@{/favicon.ico}">
    <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
</head>
<body>
<header class="topbar">
    <div class="topbar__inner">
        <a class="brand" th:href="@{/items}">Nordic Things</a>
        <nav class="nav" aria-label="Hauptnavigation">
            <a class="nav__link" th:href="@{/items}">Inventar</a>
            <a class="nav__link" th:href="@{/categories}">Kategorien</a>
            <a class="nav__link" th:href="@{/locations}">Orte</a>
            <a class="nav__link nav__link--active" th:href="@{/sources}">Bezugsquellen</a>
        </nav>
    </div>
</header>

<main class="page page--narrow">
    <div class="page__header">
        <h1>Bezugsquelle löschen</h1>
        <a class="button button--secondary" th:href="@{/sources}">Zurück zu Bezugsquellen</a>
    </div>

    <section class="confirm-box" aria-label="Bezugsquelle löschen">
        <p>Diese Bezugsquelle wird dauerhaft gelöscht.</p>
        <dl class="confirm-details">
            <div>
                <dt>Name</dt>
                <dd th:text="${source.name}">Amazon</dd>
            </div>
            <div>
                <dt>Details</dt>
                <dd th:text="${source.details}">Online</dd>
            </div>
        </dl>
        <form class="form__actions" method="post" th:action="@{/sources/{id}/delete(id=${source.id})}">
            <button class="button button--danger" type="submit">Endgültig löschen</button>
            <a class="button button--secondary" th:href="@{/sources}">Abbrechen</a>
        </form>
    </section>
</main>
</body>
</html>
